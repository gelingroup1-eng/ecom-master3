<body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // ===== حماية استدعاءات /api/ (GitHub Pages لا يشغّل server.js) =====
        // على GitHub Pages يعيد أي طلب /api/... صفحة HTML (404) بدل JSON، فيظهر الخطأ "Unexpected token '<'".
        // هذا الغلاف يحوّل تلك الحالة إلى TypeError فتعرض الواجهة رسالة "السيرفر غير شغّال" الواضحة.
        const IS_STATIC_HOST = /github\.io$|netlify\.app$|vercel\.app$|pages\.dev$/i.test(location.hostname) || location.protocol === 'file:';
        const OFFLINE_HINT = IS_STATIC_HOST
            ? 'أنت تفتح نسخة الاستضافة (GitHub Pages) وهي واجهة فقط بلا سيرفر. لربط Aranex شغّل start.bat على جهازك ثم افتح http://localhost:3000 واحفظ التوكن هناك.'
            : 'السيرفر غير شغّال. شغّل start.bat (أو node server.js) ثم افتح http://localhost:3000';
        (() => {
            const nativeFetch = window.fetch.bind(window);
            window.fetch = async (url, opts) => {
                if (typeof url === 'string' && url.startsWith('/api/')) {
                    const res = await nativeFetch(url, opts); // فشل الشبكة يبقى TypeError كما هو
                    const ct = (res.headers.get('content-type') || '').toLowerCase();
                    if (ct.includes('text/html')) throw new TypeError(OFFLINE_HINT);
                    return res;
                }
                return nativeFetch(url, opts);
            };
        })();

        const { useState, useEffect, useMemo, useRef } = React;

        // Currency Formatter Utility
        const formatCurrency = (valInDZD, formatUnit = 'DZD') => {
            if (formatUnit === 'CENTIMES') {
                const centimes = valInDZD * 100;
                if (Math.abs(centimes) >= 100000000) {
                    return (centimes / 100000000).toFixed(2) + ' مليون سنتيم';
                } else if (Math.abs(centimes) >= 100000) {
                    return (centimes / 100000).toFixed(1) + ' ألف سنتيم';
                }
                return Math.round(centimes).toLocaleString('ar-DZ') + ' سنتيم';
            }
            return Math.round(valInDZD).toLocaleString('fr-FR') + ' د.ج';
        };

        // Initial Data Mock: Confirmators Team
        const initialAgents = [
            { id: 'ag-1', name: 'سارة العلمي', role: 'confirmator', paymentMode: 'per_delivered', monthlySalary: 0, phone: '0551234567', email: 'sara@ecompulse.dz', joinDate: '2025-11-15', commissionPerDelivered: 150, paidCommissions: 1500, payments: [], notes: 'ممتازة في إعادة الاتصال بالزبائن غير المجيبين.' },
            { id: 'ag-2', name: 'أحمد بن علي', role: 'confirmator', paymentMode: 'per_confirmed', monthlySalary: 0, phone: '0662345678', email: 'ahmed@ecompulse.dz', joinDate: '2026-01-10', commissionPerDelivered: 150, paidCommissions: 0, payments: [], notes: 'متخصص في التأكيد السريع لولايات الوسط والشرق.' },
            { id: 'ag-3', name: 'مريم بلقاسم', role: 'confirmator', paymentMode: 'per_delivered', monthlySalary: 0, phone: '0773456789', email: 'meriem@ecompulse.dz', joinDate: '2026-02-01', commissionPerDelivered: 150, paidCommissions: 500, payments: [], notes: 'دقيقة في تدوين الملاحظات والعناوين التفصيلية.' },
        ];

        // Initial Mock Products
        const initialProducts = [
            { id: 'prod-1', name: 'مرآة القمر المضيئة LED 70cm', sku: 'LUNE-LED-70', costPrice: 1500, sellingPrice: 4800, stock: 145 },
            { id: 'prod-2', name: 'طاولة قهوة مودرن خشبي', sku: 'TABLE-WOOD-MD', costPrice: 3200, sellingPrice: 7900, stock: 48 },
            { id: 'prod-3', name: 'منظم مكياج أكريليك فاخر', sku: 'ORG-ACRYL-01', costPrice: 900, sellingPrice: 2900, stock: 210 },
        ];

        // API Configurations Default State
        const defaultApiConfigs = {
            Aranex: { apiKey: '', token: '', active: false, label: 'Aranex (EcoTrack)' },
            Yalidine: { apiKey: '', token: '', active: false, label: 'Yalidine Express' },
            Aramex: { apiKey: '', token: '', active: false, label: 'Aramex Algeria' },
            ZRExpress: { apiKey: '', token: '', active: false, label: 'ZR Express Logistics' }
        };

        // الولايات الـ 58 (الرمز - الاسم) — الرمز هو ما يُرسل إلى Aranex
        const WILAYAS = ['01 - أدرار', '02 - الشلف', '03 - الأغواط', '04 - أم البواقي', '05 - باتنة', '06 - بجاية', '07 - بسكرة', '08 - بشار', '09 - البليدة', '10 - البويرة', '11 - تمنراست', '12 - تبسة', '13 - تلمسان', '14 - تيارت', '15 - تيزي وزو', '16 - الجزائر', '17 - الجلفة', '18 - جيجل', '19 - سطيف', '20 - سعيدة', '21 - سكيكدة', '22 - سيدي بلعباس', '23 - عنابة', '24 - قالمة', '25 - قسنطينة', '26 - المدية', '27 - مستغانم', '28 - المسيلة', '29 - معسكر', '30 - ورقلة', '31 - وهران', '32 - البيض', '33 - إليزي', '34 - برج بوعريريج', '35 - بومرداس', '36 - الطارف', '37 - تندوف', '38 - تيسمسيلت', '39 - الوادي', '40 - خنشلة', '41 - سوق أهراس', '42 - تيبازة', '43 - ميلة', '44 - عين الدفلى', '45 - النعامة', '46 - عين تموشنت', '47 - غرداية', '48 - غليزان', '49 - تيميمون', '50 - برج باجي مختار', '51 - أولاد جلال', '52 - بني عباس', '53 - عين صالح', '54 - عين قزام', '55 - تقرت', '56 - جانت', '57 - المغير', '58 - المنيعة'];
        // توحيد الاسم القديم EcoTrack ← Aranex
        const normCarrier = (c) => (!c || c === 'EcoTrack') ? 'Aranex' : c;

        // Initial Mock Orders
        const initialOrders = [
            { id: 'ORD-1001', clientName: 'محمد أمين', phone: '0550123456', wilaya: '16 - الجزائر', address: 'باب الزوار, حي 8 مايو', product: 'مرآة القمر المضيئة LED 70cm', quantity: 1, totalAmount: 4800, status: 'LIVRE', confirmatorId: 'ag-1', confirmatorName: 'سارة العلمي', trackingCode: 'ECO-992101-DZ', deliveryCompany: 'EcoTrack', date: '2026-03-10', notes: 'تم الاستلام والتدقيق' },
            { id: 'ORD-1002', clientName: 'كريمة بوعلام', phone: '0661987654', wilaya: '31 - وهران', address: 'حي الزيتون, وهران المركز', product: 'مرآة القمر المضيئة LED 70cm', quantity: 1, totalAmount: 4800, status: 'CONFIRMED', confirmatorId: 'ag-1', confirmatorName: 'سارة العلمي', trackingCode: '', deliveryCompany: 'EcoTrack', date: '2026-03-11', notes: 'تأكيد هاتفي مقترن بالطلب' },
            { id: 'ORD-1003', clientName: 'عبد القادر شريف', phone: '0770554433', wilaya: '19 - سطيف', address: 'شارع البساتين', product: 'طاولة قهوة مودرن خشبي', quantity: 1, totalAmount: 7900, status: 'CONFIRMED', confirmatorId: 'ag-2', confirmatorName: 'أحمد بن علي', trackingCode: '', deliveryCompany: 'Yalidine', date: '2026-03-11', notes: 'جاهز للشحن المباشر' },
            { id: 'ORD-1004', clientName: 'فاطمة الزهراء', phone: '0558112233', wilaya: '25 - قسنطينة', address: 'سيدي مبروك', product: 'منظم مكياج أكريليك فاخر', quantity: 2, totalAmount: 5800, status: 'RETOUR', confirmatorId: 'ag-3', confirmatorName: 'مريم بلقاسم', trackingCode: 'ECO-773412-DZ', deliveryCompany: 'EcoTrack', date: '2026-03-09', notes: 'الزبون لم يرد على الهاتف', returnReason: 'عدم الرد أثناء التوصيل' },
            { id: 'ORD-1005', clientName: 'سمير خليل', phone: '0664332211', wilaya: '09 - البليدة', address: 'أولاد يعيش', product: 'مرآة القمر المضيئة LED 70cm', quantity: 1, totalAmount: 4800, status: 'NEW', confirmatorId: '', confirmatorName: 'غير معين', trackingCode: '', deliveryCompany: 'EcoTrack', date: '2026-03-12', notes: 'طلب جديد مسجل في المتجر' },
            { id: 'ORD-1006', clientName: 'ياسين حيدر', phone: '0771998877', wilaya: '23 - عنابة', address: 'سيدي عمار', product: 'طاولة قهوة مودرن خشبي', quantity: 1, totalAmount: 7900, status: 'NEW', confirmatorId: '', confirmatorName: 'غير معين', trackingCode: '', deliveryCompany: 'Yalidine', date: '2026-03-12', notes: 'طلب جديد مسجل في المتجر' },
        ];

        function App() {
            // Load state from localStorage or default
            const [apiConfigs, setApiConfigs] = useState(() => {
                const saved = localStorage.getItem('ecom_pulse_api_configs');
                return saved ? JSON.parse(saved) : defaultApiConfigs;
            });
            const [orders, setOrders] = useState(() => {
                const saved = localStorage.getItem('ecom_pulse_orders');
                return (saved ? JSON.parse(saved) : initialOrders).map(o => ({ ...o, deliveryCompany: normCarrier(o.deliveryCompany) }));
            });
            const [agents, setAgents] = useState(() => {
                const saved = localStorage.getItem('ecom_pulse_agents');
                return saved ? JSON.parse(saved) : initialAgents;
            });
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('ecom_pulse_products');
                return saved ? JSON.parse(saved) : initialProducts;
            });
            const [auditLog, setAuditLog] = useState(() => {
                const saved = localStorage.getItem('ecom_pulse_audit_log');
                return saved ? JSON.parse(saved) : [];
            });
            const [aranexStatus, setAranexStatus] = useState(null);
            const [metaReadOnly, setMetaReadOnly] = useState({ adAccountId: '' });

            // إضافات من نسخة التعديل: المصاريف وتحليلات Meta Ads
            const [expenses, setExpenses] = useState(() => {
                const saved = localStorage.getItem('ecom_pulse_expenses');
                return saved ? JSON.parse(saved) : [
                    { id: 1, category: 'رواتب', title: 'راتب عامل الورشة - أحمد', amount: 35000, date: '2026-09-01' },
                    { id: 2, category: 'مواد أولية', title: 'شراء 500 كرتون تغليف', amount: 45000, date: '2026-09-05' },
                    { id: 3, category: 'محتوى', title: 'إنتاج 15 فيديو إشهاري', amount: 15000, date: '2026-09-10' }
                ];
            });
            const [newExpense, setNewExpense] = useState({ category: 'مواد أولية', title: '', amount: '' });
            const [metaSettings, setMetaSettings] = useState(() => {
                const saved = localStorage.getItem('ecom_pulse_meta_settings');
                return saved ? JSON.parse(saved) : { pixelId: '', accessToken: '' };
            });
            const [aiAnalysis, setAiAnalysis] = useState(null);

            const [activeTab, setActiveTab] = useState('orders'); // orders, dispatch, api_settings, agents, financials, inventory, expenses, meta_ai
            const [displayUnit, setDisplayUnit] = useState('DZD'); 
            const [orderFilter, setOrderFilter] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedOrderIds, setSelectedOrderIds] = useState([]);

            // Modals
            const [isNewOrderModalOpen, setIsNewOrderModalOpen] = useState(false);
            const [isEditOrderModalOpen, setIsEditOrderModalOpen] = useState(false);
            const [editingOrder, setEditingOrder] = useState(null);
            
            const [isNewAgentModalOpen, setIsNewAgentModalOpen] = useState(false);
            const [isEditAgentModalOpen, setIsEditAgentModalOpen] = useState(false);
            const [editingAgent, setEditingAgent] = useState(null);

            // Agent Profile Dossier Modal
            const [selectedAgentDossier, setSelectedAgentDossier] = useState(null);

            const [isBulkDispatchModalOpen, setIsBulkDispatchModalOpen] = useState(false);
            const [bulkCarrier, setBulkCarrier] = useState('Aranex');

            const [isPrintSlipModalOpen, setIsPrintSlipModalOpen] = useState(false);
            const [ordersToPrint, setOrdersToPrint] = useState([]);

            const [toastMessage, setToastMessage] = useState('');

            // Forms
            const [newOrder, setNewOrder] = useState({ clientName: '', phone: '', wilaya: '16 - الجزائر', address: '', product: initialProducts[0].name, quantity: 1, deliveryCompany: 'Aranex', commune: '' });
            const [newAgent, setNewAgent] = useState({ name: '', phone: '', email: '', role: 'confirmator', paymentMode: 'per_delivered', monthlySalary: 0, commissionPerDelivered: 150, notes: '' });

            // ===== ربط Aranex (EcoTrack) عبر السيرفر المحلي =====
            const [communes, setCommunes] = useState([]);
            const communesCache = useRef({});
            const [isSyncing, setIsSyncing] = useState(false);
            const aranexReady = !!(aranexStatus && aranexStatus.ok);
            const isLinked = (key) => key === 'Aranex' ? aranexReady : !!(apiConfigs[key] && apiConfigs[key].active && apiConfigs[key].apiKey);

            const checkAranex = async (silent) => {
                try {
                    setAranexStatus({ loading: true });
                    const r = await fetch('/api/aranex/test');
                    const d = await r.json();
                    if (!r.ok || d.success === false) throw new Error(d.error || 'فشل الاتصال');
                    setAranexStatus({ ok: true, message: 'الاتصال حقيقي وناجح — حساب Aranex (' + (d.baseUrl || '') + ') جاهز.' });
                    return true;
                } catch (err) {
                    const offline = err instanceof TypeError;
                    setAranexStatus({ ok: false, message: offline ? OFFLINE_HINT : err.message });
                    if (!silent) showToast('❌ ' + (offline ? OFFLINE_HINT : err.message));
                    return false;
                }
            };
            useEffect(() => { checkAranex(true); }, []);

            const loadCommunes = async (wilayaStr) => {
                const code = parseInt(wilayaStr, 10);
                if (!code) { setCommunes([]); return; }
                if (communesCache.current[code]) { setCommunes(communesCache.current[code]); return; }
                try {
                    const r = await fetch('/api/aranex/communes?wilaya_id=' + code);
                    const d = await r.json();
                    const names = (d.communes || []).filter(c => !c.wilaya_id || Number(c.wilaya_id) === code).map(c => c.nom);
                    communesCache.current[code] = names;
                    setCommunes(names);
                } catch (_) { setCommunes([]); }
            };
            useEffect(() => {
                if (isNewOrderModalOpen) loadCommunes(newOrder.wilaya);
                else if (isEditOrderModalOpen && editingOrder) loadCommunes(editingOrder.wilaya);
            }, [isNewOrderModalOpen, isEditOrderModalOpen, newOrder.wilaya, editingOrder && editingOrder.wilaya]);

            // مزامنة حالات الشحنات من Aranex (تسليم / رجوع)
            const handleSyncAranex = async (silent) => {
                const sent = orders.filter(o => o.trackingCode && normCarrier(o.deliveryCompany) === 'Aranex' && o.status === 'DISPATCHED');
                if (!sent.length) { if (!silent) showToast('ℹ️ لا توجد شحنات مرسلة للمزامنة.'); return; }
                try {
                    setIsSyncing(true);
                    const r = await fetch('/api/aranex/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trackings: sent.map(o => o.trackingCode) }) });
                    const d = await r.json();
                    if (!r.ok || d.success === false) throw new Error(d.error || 'فشلت المزامنة');
                    let changed = 0;
                    setOrders(prev => prev.map(o => {
                        const st = d.statuses && d.statuses[o.trackingCode];
                        if (!st || o.status !== 'DISPATCHED') return o;
                        if (st.status !== 'DISPATCHED') changed++;
                        return { ...o, status: st.status, carrierStatus: st.raw, carrierStatusDate: st.date, returnReason: st.status === 'RETOUR' ? (st.raw || 'مرتجع من Aranex') : o.returnReason };
                    }));
                    logAction('ARANEX_SYNC', { checked: sent.length, changed });
                    if (!silent) showToast('🔄 تمت المزامنة: ' + changed + ' شحنة تغيّرت حالتها من أصل ' + sent.length);
                } catch (err) { if (!silent) showToast('❌ ' + err.message); }
                finally { setIsSyncing(false); }
            };
            useEffect(() => {
                if (!aranexReady) return;
                const t = setInterval(() => handleSyncAranex(true), 10 * 60 * 1000);
                return () => clearInterval(t);
            }, [aranexReady, orders]);

            const handleCancelAranex = async (order) => {
                if (!confirm('إلغاء الشحنة ' + order.trackingCode + ' لدى Aranex؟')) return;
                try {
                    const r = await fetch('/api/aranex/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracking: order.trackingCode }) });
                    const d = await r.json();
                    if (!r.ok || d.success === false) throw new Error(d.error || 'تعذر الإلغاء');
                    setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: 'CONFIRMED', trackingCode: '', apiStatus: '', apiMessage: '', carrierStatus: '' } : o));
                    logAction('ARANEX_CANCEL', { id: order.id, tracking: order.trackingCode });
                    showToast('🗑️ تم إلغاء الشحنة وإرجاع الطلب إلى حالة مؤكد.');
                } catch (err) { showToast('❌ ' + err.message); }
            };

            // Sync to LocalStorage on updates
            useEffect(() => {
                localStorage.setItem('ecom_pulse_api_configs', JSON.stringify(apiConfigs));
            }, [apiConfigs]);

            useEffect(() => {
                localStorage.setItem('ecom_pulse_orders', JSON.stringify(orders));
            }, [orders]);

            useEffect(() => {
                localStorage.setItem('ecom_pulse_agents', JSON.stringify(agents));
            }, [agents]);
            useEffect(() => {
                localStorage.setItem('ecom_pulse_products', JSON.stringify(products));
            }, [products]);
            useEffect(() => {
                localStorage.setItem('ecom_pulse_audit_log', JSON.stringify(auditLog.slice(-500)));
            }, [auditLog]);

            useEffect(() => {
                localStorage.setItem('ecom_pulse_expenses', JSON.stringify(expenses));
            }, [expenses]);

            useEffect(() => {
                localStorage.setItem('ecom_pulse_meta_settings', JSON.stringify(metaSettings));
            }, [metaSettings]);

            // Core helpers
            const logAction = (action, details = {}) => {
                setAuditLog(prev => [...prev, { id: Date.now() + Math.random(), date: new Date().toISOString(), action, details }]);
            };
            const safeNum = (v) => Number(v || 0);
            const roleLabels = { confirmator: 'موظف تأكيد', workshop: 'عامل ورشة', packer: 'عامل تغليف', warehouse: 'عامل مخزن', admin: 'مسؤول', other: 'موظف آخر' };
            const paymentModeLabels = { monthly: 'راتب شهري', per_confirmed: 'على كل طلبية مؤكدة', per_delivered: 'على كل طلبية مستلمة' };
            const getAgentEarned = (agent) => {
                if (!agent) return 0;
                if ((agent.paymentMode || 'per_delivered') === 'monthly') return safeNum(agent.monthlySalary);
                const assigned = orders.filter(o => o.confirmatorId === agent.id);
                const count = (agent.paymentMode || 'per_delivered') === 'per_confirmed'
                    ? assigned.filter(o => ['CONFIRMED','DISPATCHED','LIVRE','RETOUR'].includes(o.status)).length
                    : assigned.filter(o => o.status === 'LIVRE').length;
                return count * safeNum(agent.commissionPerDelivered);
            };
            const getAgentRemaining = (agent) => Math.max(0, getAgentEarned(agent) - safeNum(agent.paidCommissions));

            // Toast Alert Handler
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3500);
            };

            const handleAddExpense = (e) => {
                e.preventDefault();
                const amount = parseFloat(newExpense.amount);
                if (!newExpense.title.trim() || !amount || amount <= 0) {
                    showToast('⚠️ أدخل وصف المصروف والمبلغ بشكل صحيح.');
                    return;
                }
                setExpenses(prev => [...prev, {
                    id: Date.now(),
                    category: newExpense.category,
                    title: newExpense.title.trim(),
                    amount,
                    date: new Date().toISOString().split('T')[0]
                }]);
                setNewExpense({ category: 'مواد أولية', title: '', amount: '' });
                showToast('✅ تمت إضافة المصروف وحفظه.');
            };

            const handleDeleteExpense = (id) => {
                setExpenses(prev => prev.filter(exp => exp.id !== id));
                showToast('🗑️ تم حذف المصروف.');
            };

            const runAiMetaAnalysis = () => {
                if (!metaSettings.pixelId || !metaSettings.accessToken) {
                    showToast('⚠️ أدخل Meta Pixel ID وAccess Token أولاً.');
                    return;
                }
                setAiAnalysis('جاري تحليل بيانات Meta Ads...');
                setTimeout(() => {
                    const delivered = orders.filter(o => o.status === 'LIVRE').length;
                    const confirmed = orders.filter(o => ['CONFIRMED','DISPATCHED','LIVRE','RETOUR'].includes(o.status)).length;
                    const deliveryRate = confirmed ? ((delivered / confirmed) * 100).toFixed(1) : '0.0';
                    setAiAnalysis({
                        cpaStatus: 'تم تجهيز التحليل التجريبي — اربط Backend/Meta Graph API لقراءة الأرقام الحقيقية.',
                        deliveryCorrelation: `${deliveryRate}% من الطلبات المؤكدة وصلت إلى حالة Livré.`,
                        recommendation: delivered > 0
                            ? 'ركّز الميزانية على الحملات والمنتجات التي تحقق أعلى عدد من الطلبات المستلمة، وقارن CPA مع هامش الربح قبل رفع الميزانية.'
                            : 'لا توجد طلبات Livré كافية لإصدار توصية مالية موثوقة بعد.'
                    });
                }, 800);
            };

            const filteredOrders = useMemo(() => {
                return orders.filter(o => {
                    const matchesStatus = orderFilter === 'ALL' || o.status === orderFilter;
                    const matchesSearch = searchQuery === '' || 
                        o.clientName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        o.phone.includes(searchQuery) ||
                        o.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        o.wilaya.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        o.product.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesStatus && matchesSearch;
                });
            }, [orders, orderFilter, searchQuery]);

            // Selection Helpers
            const handleSelectAllOrders = (e) => {
                if (e.target.checked) {
                    setSelectedOrderIds(filteredOrders.map(o => o.id));
                } else {
                    setSelectedOrderIds([]);
                }
            };

            const handleToggleSelectOrder = (id) => {
                setSelectedOrderIds(prev => 
                    prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
                );
            };

            const renderStatusBadge = (status) => {
                switch(status) {
                    case 'NEW':
                        return <span className="bg-amber-500/20 text-amber-400 border border-amber-500/40 px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1 w-max"><i className="fa-solid fa-clock-rotate-left"></i> جديد</span>;
                    case 'CONFIRMED':
                        return <span className="bg-blue-500/20 text-blue-400 border border-blue-500/40 px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1 w-max"><i className="fa-solid fa-check-circle"></i> مؤكد (جاهز للشحن)</span>;
                    case 'DISPATCHED':
                        return <span className="bg-purple-500/20 text-purple-400 border border-purple-500/40 px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1 w-max"><i className="fa-solid fa-truck-fast"></i> مرسل للتوصيل</span>;
                    case 'LIVRE':
                        return <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1 w-max"><i className="fa-solid fa-box-open"></i> تم الاستلام (Livré)</span>;
                    case 'RETOUR':
                        return <span className="bg-rose-500/20 text-rose-400 border border-rose-500/40 px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1 w-max"><i className="fa-solid fa-rotate-left"></i> مرتجع (Retour)</span>;
                    case 'CANCELED':
                        return <span className="bg-slate-500/20 text-slate-400 border border-slate-500/40 px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1 w-max"><i className="fa-solid fa-xmark"></i> ملغى</span>;
                    default:
                        return status;
                }
            };

            const handleAssignConfirmator = (orderId, agentId) => {
                const agent = agents.find(a => a.id === agentId);
                setOrders(prev => prev.map(o => {
                    if (o.id === orderId) {
                        return { 
                            ...o, 
                            confirmatorId: agentId, 
                            confirmatorName: agent ? agent.name : 'غير معين',
                            status: o.status === 'NEW' ? 'CONFIRMED' : o.status
                        };
                    }
                    return o;
                }));
                showToast(`تم تعيين الطلب ${orderId} للموظف ${agent ? agent.name : ''} وتأكيده.`);
            };

            const handleUpdateOrderStatus = (orderId, newStatus) => {
                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
                showToast(`تم تعديل حالة الطلبية ${orderId} إلى ${newStatus}`);
            };

            // Explicitly Save API Configurations
            const handleSaveApiConfig = async (carrierKey) => {
                const cfg = apiConfigs[carrierKey];
                if (carrierKey === 'Aranex') {
                    const token = (cfg.apiKey || '').trim();
                    if (!token) { showToast(aranexReady ? 'ℹ️ التوكن محفوظ في السيرفر مسبقاً. الصق توكناً جديداً فقط إذا أردت تغييره.' : '⚠️ الصق توكن Aranex أولاً.'); return; }
                    try {
                        const r = await fetch('/api/aranex/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
                        const d = await r.json();
                        if (!r.ok || d.success === false) throw new Error(d.error || 'رُفض التوكن');
                        setApiConfigs(prev => ({ ...prev, Aranex: { ...prev.Aranex, apiKey: '', token: '', active: true } }));
                        await checkAranex(true);
                        logAction('ARANEX_TOKEN_SAVED');
                        showToast('✅ تم التحقق من التوكن وحفظه في السيرفر (لا يُخزَّن في المتصفح).');
                    } catch (err) { showToast('❌ ' + (err instanceof TypeError ? OFFLINE_HINT : err.message)); }
                    return;
                }
                if (!cfg.apiKey.trim()) {
                    showToast(`⚠️ يرجى إدخال API Key الخاص بشركة ${cfg.label} أولاً.`);
                    return;
                }
                localStorage.setItem('ecom_pulse_api_configs', JSON.stringify(apiConfigs));
                showToast(`✅ تم حفظ وتأكيد مفاتيح الـ API لـ ${cfg.label} بنجاح وحفظها بالمظام!`);
            };

            // Test Connection
            const handleTestApiConnection = async (carrierKey) => {
                const cfg = apiConfigs[carrierKey];
                if (carrierKey === 'Aranex') {
                    const ok = await checkAranex(false);
                    if (ok) { setApiConfigs(prev => ({ ...prev, Aranex: { ...prev.Aranex, active: true } })); logAction('ARANEX_TEST_SUCCESS'); showToast('✅ تم اختبار Aranex فعلياً بنجاح.'); }
                    return;
                }
                if (false) {
                    try {
                        setAranexStatus({ loading: true });
                        const r = await fetch('/api/aranex/test');
                        const data = await r.json();
                        if (!r.ok || data.success === false) throw new Error(data.error || 'فشل الاتصال');
                        setAranexStatus({ ok: true, message: 'الاتصال الحقيقي ناجح — حساب Aranex جاهز.' });
                        setApiConfigs(prev => ({ ...prev, Aranex: { ...prev.Aranex, active: true } }));
                        logAction('ARANEX_TEST_SUCCESS');
                        showToast('✅ تم اختبار Aranex فعلياً بنجاح.');
                    } catch (err) {
                        setAranexStatus({ ok: false, message: err.message });
                        showToast('❌ فشل اتصال Aranex: ' + err.message);
                    }
                    return;
                }
                if (!cfg.apiKey || cfg.apiKey.trim().length < 5) {
                    showToast(`❌ فشل الاتصال: بيانات ${cfg.label} غير مكتملة.`);
                    return;
                }
                showToast(`ℹ️ تم حفظ إعدادات ${cfg.label}. الاختبار الحقيقي يحتاج Backend خاص بالشركة.`);
            };

            // Bulk Dispatch Execution via API
            const handleExecuteBulkDispatch = async () => {
                if (selectedOrderIds.length === 0) {
                    showToast('⚠️ الرجاء اختيار طلبية واحدة على الأقل للشحن.');
                    return;
                }
                const selected = orders.filter(o => selectedOrderIds.includes(o.id) && !o.trackingCode);
                if (selected.length === 0) { showToast('⚠️ الطلبات المحددة أُرسلت مسبقاً أو لا يوجد ما يُرسل.'); return; }
                const missing = selected.filter(o => !String(o.commune || '').trim());
                if (missing.length) { showToast('⚠️ البلدية (commune) ناقصة في: ' + missing.map(o => o.id).join('، ') + ' — عدّل الطلب (زر القلم) وأضفها ثم أعد المحاولة.'); return; }
                if (bulkCarrier !== 'Aranex') {
                    showToast('ℹ️ في هذه النسخة الربط الحقيقي المفعّل هو Aranex. الشركات الأخرى تحتاج Backend مستقل.');
                    return;
                }
                try {
                    showToast('⏳ جارٍ إرسال الطلبيات فعلياً إلى Aranex...');
                    const r = await fetch('/api/aranex/orders/bulk', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ orders: selected })
                    });
                    const data = await r.json();
                    if (!r.ok || data.success === false) throw new Error(data.error || 'فشل الإرسال');
                    const results = data.results || [];
                    setOrders(prev => prev.map(o => {
                        const result = results.find(x => x.orderId === o.id);
                        if (!result) return o;
                        return { ...o, status: result.success ? 'DISPATCHED' : o.status, deliveryCompany: 'Aranex', trackingCode: result.tracking || o.trackingCode, apiStatus: result.success ? 'SENT' : 'ERROR', apiMessage: result.message || '' };
                    }));
                    const failed = results.filter(x => !x.success);
                    if (failed.length) alert('تعذر إرسال ' + failed.length + ' طلب:\n\n' + failed.map(x => x.orderId + ' ← ' + x.message).join('\n'));
                    logAction('ARANEX_BULK_DISPATCH', { count: selected.length, results });
                    setSelectedOrderIds([]);
                    setIsBulkDispatchModalOpen(false);
                    showToast(`🚀 تم إرسال ${results.filter(x => x.success).length} من ${selected.length} طلبية إلى Aranex — تجدها في aranex.ecotrack.dz`);
                } catch (err) {
                    showToast('❌ لم يتم إرسال الطلبات: ' + err.message);
                }
            };

            const handleAddAgentSubmit = (e) => {
                e.preventDefault();
                const createdAgent = {
                    id: `ag-${Date.now()}`,
                    name: newAgent.name,
                    role: newAgent.role || 'confirmator',
                    paymentMode: newAgent.paymentMode || 'per_delivered',
                    monthlySalary: safeNum(newAgent.monthlySalary),
                    phone: newAgent.phone,
                    email: newAgent.email || `${newAgent.name.toLowerCase().replace(/\s+/g, '')}@ecompulse.dz`,
                    joinDate: new Date().toISOString().split('T')[0],
                    commissionPerDelivered: safeNum(newAgent.commissionPerDelivered) || 150,
                    paidCommissions: 0,
                    payments: [],
                    notes: newAgent.notes || ''
                };
                setAgents([...agents, createdAgent]);
                setIsNewAgentModalOpen(false);
                setNewAgent({ name: '', phone: '', email: '', role: 'confirmator', paymentMode: 'per_delivered', monthlySalary: 0, commissionPerDelivered: 150, notes: '' });
                showToast(`👤 تم إضافة ملف الموظف ${createdAgent.name} بنجاح.`);
            };

            const handleSaveAgentEdit = (e) => {
                e.preventDefault();
                setAgents(prev => prev.map(a => a.id === editingAgent.id ? editingAgent : a));
                setIsEditAgentModalOpen(false);
                setEditingAgent(null);
                showToast('✅ تم تحديث بيانات ملف الموظف بنجاح.');
            };

            const handleDeleteAgent = (agentId) => {
                const agent = agents.find(a => a.id === agentId);
                if (confirm(`هل أنت تأكد من حذف ملف الموظف "${agent?.name}"؟ سيتم إلغاء ربط طلبياته الموكلة إليه.`)) {
                    setAgents(prev => prev.filter(a => a.id !== agentId));
                    setOrders(prev => prev.map(o => o.confirmatorId === agentId ? { ...o, confirmatorId: '', confirmatorName: 'غير معين' } : o));
                    showToast(`🗑️ تم حذف ملف الموظف وإعادة إتاحة طلبياته.`);
                }
            };

            const handlePayAgentCommission = (agentId, amount) => {
                setAgents(prev => prev.map(a => {
                    if (a.id === agentId) {
                        return { ...a, paidCommissions: (a.paidCommissions || 0) + amount };
                    }
                    return a;
                }));
                showToast(`💳 تم تسجيل تسديد مبلغ ${formatCurrency(amount, displayUnit)} للموظف.`);
            };

            const handleAddOrderSubmit = (e) => {
                e.preventDefault();
                const prodObj = products.find(p => p.name === newOrder.product) || products[0];
                const createdOrder = {
                    id: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
                    clientName: newOrder.clientName,
                    phone: newOrder.phone,
                    wilaya: newOrder.wilaya,
                    address: newOrder.address,
                    commune: (newOrder.commune || '').trim(),
                    product: newOrder.product,
                    quantity: parseInt(newOrder.quantity) || 1,
                    totalAmount: prodObj.sellingPrice * (parseInt(newOrder.quantity) || 1),
                    status: 'NEW',
                    confirmatorId: '',
                    confirmatorName: 'غير معين',
                    trackingCode: '',
                    deliveryCompany: newOrder.deliveryCompany,
                    date: new Date().toISOString().split('T')[0],
                    notes: 'طلب جديد يدوي'
                };

                setOrders([createdOrder, ...orders]);
                setIsNewOrderModalOpen(false);
                setNewOrder({ clientName: '', phone: '', wilaya: '16 - الجزائر', address: '', product: products[0].name, quantity: 1, deliveryCompany: 'Aranex', commune: '' });
                showToast('✅ تم تسجيل الطلبية الجديدة بنجاح.');
            };

            const handleSaveOrderEdit = (e) => {
                e.preventDefault();
                const prodObj = products.find(p => p.name === editingOrder.product) || products[0];
                const updated = {
                    ...editingOrder,
                    totalAmount: prodObj.sellingPrice * (parseInt(editingOrder.quantity) || 1)
                };
                setOrders(prev => prev.map(o => o.id === editingOrder.id ? updated : o));
                setIsEditOrderModalOpen(false);
                setEditingOrder(null);
                showToast('✅ تم تعديل بيانات الطلبية بنجاح.');
            };

            const handleDeleteOrder = (orderId) => {
                if (confirm(`هل أنت متأكد من حذف الطلبية رقم ${orderId}؟`)) {
                    setOrders(prev => prev.filter(o => o.id !== orderId));
                    setSelectedOrderIds(prev => prev.filter(id => id !== orderId));
                    showToast('🗑️ تم حذف الطلبية.');
                }
            };

            const handleOpenPrintSlips = (targetOrders) => {
                setOrdersToPrint(targetOrders);
                setIsPrintSlipModalOpen(true);
            };
            // Real XLSX exports (not CSV renamed as Excel)
            const downloadWorkbook = (rows, sheetName, fileName) => {
                if (!window.XLSX) { showToast('❌ مكتبة Excel لم تُحمّل. أعد فتح الصفحة مع الإنترنت.'); return; }
                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,31));
                XLSX.writeFile(wb, fileName);
            };
            const handleExportOrdersXLSX = (rows = orders, label = 'Orders') => {
                const data = rows.map(o => ({
                    'رقم الطلب': o.id, 'الزبون': o.clientName, 'الهاتف': o.phone, 'الولاية': o.wilaya,
                    'العنوان': o.address, 'المنتج': o.product, 'الكمية': o.quantity, 'المبلغ': o.totalAmount,
                    'الحالة': o.status, 'شركة التوصيل': o.deliveryCompany || '', 'Tracking': o.trackingCode || '',
                    'المؤكد': o.confirmatorName || '', 'التاريخ': o.date || '', 'ملاحظات': o.notes || ''
                }));
                downloadWorkbook(data, label, `EComPulse_${label}_${new Date().toISOString().slice(0,10)}.xlsx`);
                showToast(`📥 تم تحميل ملف Excel الحقيقي: ${data.length} طلبية.`);
            };
            const handleExportDispatchXLSX = () => {
                const rows = orders.filter(o => ['CONFIRMED','DISPATCHED'].includes(o.status));
                handleExportOrdersXLSX(rows, 'Shipping');
            };
            const handleExportAgentsCSV = () => {
                const data = agents.map(a => ({
                    'ID': a.id, 'الاسم': a.name, 'الدور': roleLabels[a.role] || a.role, 'الهاتف': a.phone,
                    'نظام الدفع': paymentModeLabels[a.paymentMode] || a.paymentMode, 'الراتب الشهري': safeNum(a.monthlySalary),
                    'العمولة': safeNum(a.commissionPerDelivered), 'المكتسب': getAgentEarned(a), 'المدفوع': safeNum(a.paidCommissions),
                    'المتبقي': getAgentRemaining(a), 'تاريخ الانضمام': a.joinDate || '', 'ملاحظات': a.notes || ''
                }));
                downloadWorkbook(data, 'Staff', `EComPulse_Staff_${new Date().toISOString().slice(0,10)}.xlsx`);
            };
            const handleExportAllData = () => {
                if (!window.XLSX) return showToast('❌ مكتبة Excel لم تُحمّل.');
                const wb = XLSX.utils.book_new();
                const sheets = {
                    'Orders': orders.map(o => ({...o})),
                    'Shipping': orders.filter(o => ['CONFIRMED','DISPATCHED'].includes(o.status)).map(o => ({...o})),
                    'Staff': agents.map(a => ({...a, role: roleLabels[a.role] || a.role, paymentMode: paymentModeLabels[a.paymentMode] || a.paymentMode})),
                    'Expenses': expenses.map(e => ({...e})),
                    'Products': products.map(p => ({...p})),
                    'Audit': auditLog.map(a => ({...a}))
                };
                Object.entries(sheets).forEach(([name, rows]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), name));
                XLSX.writeFile(wb, `EComPulse_Full_Backup_${new Date().toISOString().slice(0,10)}.xlsx`);
                showToast('📦 تم تصدير نسخة Excel كاملة بكل البيانات.');
            };

            const financialStats = useMemo(() => {
                const deliveredOrders = orders.filter(o => o.status === 'LIVRE');
                const returnedOrders = orders.filter(o => o.status === 'RETOUR');
                const confirmedOrders = orders.filter(o => o.status === 'CONFIRMED' || o.status === 'DISPATCHED' || o.status === 'LIVRE' || o.status === 'RETOUR');

                const totalDeliveredRevenue = deliveredOrders.reduce((sum, o) => sum + o.totalAmount, 0);
                const totalAdSpendDZD = 45000; // Simulated Facebook ad spend
                const totalPackagingCost = confirmedOrders.length * 185;
                const totalConfirmatorCommissions = agents.reduce((sum, a) => sum + getAgentEarned(a), 0);
                const totalProductCost = deliveredOrders.reduce((sum, o) => { const p = products.find(x => x.name === o.product); return sum + safeNum(p?.costPrice) * safeNum(o.quantity); }, 0);
                const totalManualExpenses = expenses.reduce((sum, exp) => sum + Number(exp.amount || 0), 0);
                const netProfit = totalDeliveredRevenue - totalAdSpendDZD - totalPackagingCost - totalConfirmatorCommissions - totalManualExpenses - totalProductCost;

                return {
                    totalOrdersCount: orders.length,
                    deliveredCount: deliveredOrders.length,
                    returnedCount: returnedOrders.length,
                    confirmedCount: confirmedOrders.length,
                    deliveryRate: confirmedOrders.length > 0 ? ((deliveredOrders.length / confirmedOrders.length) * 100).toFixed(1) : 0,
                    totalDeliveredRevenue,
                    totalAdSpendDZD,
                    totalPackagingCost,
                    totalConfirmatorCommissions,
                    totalManualExpenses,
                    totalProductCost,
                    netProfit
                };
            }, [orders, expenses]);

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-5 left-5 z-50 bg-blue-600 text-white font-bold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-blue-400 animate-bounce">
                            <i className="fa-solid fa-circle-info text-lg"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Top Navigation Bar */}
                    <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-40 flex flex-wrap items-center justify-between gap-4 no-print">
                        <div className="flex items-center gap-3">
                            <div className="p-2.5 bg-gradient-to-tr from-blue-700 to-indigo-600 rounded-xl text-white font-extrabold text-xl tracking-wider shadow-lg flex items-center gap-2">
                                <i className="fa-solid fa-cubes-stacked"></i>
                                <span>E-COM<span className="text-blue-300">PULSE</span></span>
                            </div>
                            <span className="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1 rounded-full font-bold flex items-center gap-1.5">
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                اللوجيسيال الشامل للطلبيات، الموظفين، والربط البرمجي API 🇩🇿
                            </span>
                        </div>

                        {/* Top Control Tools */}
                        <div className="flex items-center gap-3 flex-wrap">
                            {/* Currency Unit Toggle */}
                            <div className="bg-slate-950 p-1 rounded-xl border border-slate-800 flex text-xs font-semibold">
                                <button 
                                    onClick={() => setDisplayUnit('DZD')}
                                    className={`px-3 py-1.5 rounded-lg transition ${displayUnit === 'DZD' ? 'bg-blue-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-white'}`}
                                >
                                    دينار (DZD)
                                </button>
                                <button 
                                    onClick={() => setDisplayUnit('CENTIMES')}
                                    className={`px-3 py-1.5 rounded-lg transition ${displayUnit === 'CENTIMES' ? 'bg-blue-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-white'}`}
                                >
                                    سنتيم (Centimes)
                                </button>
                            </div>

                            {/* Export CSV */}
                            <button 
                                onClick={() => handleExportOrdersXLSX()}
                                className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2"
                            >
                                <i className="fa-solid fa-file-excel text-emerald-400"></i>
                                <span>Excel الطلبات</span>
                            </button>
                            <button onClick={handleExportDispatchXLSX} className="bg-purple-900/40 hover:bg-purple-800 text-purple-200 border border-purple-800 px-3 py-1.5 rounded-xl text-xs font-bold transition">
                                <i className="fa-solid fa-truck-fast ml-1"></i> Excel الشحن
                            </button>
                            <button onClick={handleExportAllData} className="bg-amber-900/30 hover:bg-amber-800 text-amber-200 border border-amber-800 px-3 py-1.5 rounded-xl text-xs font-bold transition">
                                <i className="fa-solid fa-box-archive ml-1"></i> Backup كامل
                            </button>

                            {/* Add Order Quick Button */}
                            <button 
                                onClick={() => setIsNewOrderModalOpen(true)}
                                className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3.5 py-1.5 rounded-xl text-xs transition flex items-center gap-2 shadow-lg shadow-blue-600/30"
                            >
                                <i className="fa-solid fa-plus"></i>
                                <span>إضافة طلبية جديدة</span>
                            </button>
                        </div>

                    )}

                    {/* MODAL: EDIT AGENT */}
                    {isEditAgentModalOpen && editingAgent && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-bold text-slate-100 text-base">تعديل ملف الموظف</h3>
                                    <button onClick={() => setIsEditAgentModalOpen(false)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleSaveAgentEdit} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-slate-300 mb-1">اسم الموظف</label>
                                        <input type="text" required value={editingAgent.name} onChange={e => setEditingAgent({...editingAgent, name: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:border-blue-500" />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1">رقم الهاتف</label>
                                        <input type="text" required value={editingAgent.phone} onChange={e => setEditingAgent({...editingAgent, phone: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:border-blue-500" />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1">قيمة العمولة لكل طلب (دج)</label>
                                        <input type="number" value={editingAgent.commissionPerDelivered} onChange={e => setEditingAgent({...editingAgent, commissionPerDelivered: parseFloat(e.target.value) || 0})} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:border-blue-500" />
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition mt-2">حفظ التغييرات</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: BULK DISPATCH VIA API */}
                    {isBulkDispatchModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-purple-800/80 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-bold text-slate-100 text-base flex items-center gap-2">
                                        <i className="fa-solid fa-paper-plane text-purple-400"></i>
                                        <span>تأكيد الشحن الجماعي عبر API</span>
                                    </h3>
                                    <button onClick={() => setIsBulkDispatchModalOpen(false)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="text-xs space-y-3">
                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
                                        <div className="text-slate-400">عدد الطلبيات المحددة للشحن:</div>
                                        <div className="text-lg font-extrabold text-purple-400">{selectedOrderIds.length} طلبية</div>
                                    </div>

                                    <div>
                                        <label className="block text-slate-300 mb-1">اختر شركة التوصيل لإرسال الطلبيات إليها:</label>
                                        <select 
                                            value={bulkCarrier} 
                                            onChange={e => setBulkCarrier(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-slate-100 font-bold focus:border-purple-500"
                                        >
                                            {Object.keys(apiConfigs).map(c => (
                                                <option key={c} value={c}>{apiConfigs[c].label} {isLinked(c) ? '✅ (مربوط)' : '❌ (غير مربوط)'}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <button 
                                        onClick={handleExecuteBulkDispatch}
                                        className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-purple-600/30 text-sm mt-2"
                                    >
                                        <i className="fa-solid fa-bolt"></i>
                                        <span>تأكيد وإرسال الطلبات الآن عبر API</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PRINT SLIPS THERMAL MODAL VIEW */}
                    {isPrintSlipModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 overflow-y-auto p-4 flex flex-col items-center">
                            <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl w-full max-w-2xl mb-4 flex justify-between items-center no-print">
                                <h3 className="font-bold text-slate-100">معاينة بوليصات الشحن للطباعة ({ordersToPrint.length})</h3>
                                <div className="flex gap-2">
                                    <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2">
                                        <i className="fa-solid fa-print"></i>
                                        <span>طباعة الآن</span>
                                    </button>
                                    <button onClick={() => setIsPrintSlipModalOpen(false)} className="bg-slate-800 text-slate-300 px-3 py-2 rounded-lg text-xs font-bold">إغلاق</button>
                                </div>
                            </div>

                            {/* Printable Area */}
                            <div className="space-y-4 w-full max-w-xl text-black">
                                {ordersToPrint.map(ord => (
                                    <div key={ord.id} className="bg-white p-6 rounded-lg border-2 border-black space-y-3 font-mono">
                                        <div className="flex justify-between items-center border-b-2 border-black pb-2">
                                            <div className="font-bold text-lg">{ord.deliveryCompany || 'EXPRESS LOGISTICS'}</div>
                                            <div className="text-right text-xs">
                                                <div>رقم الطلب: <strong>{ord.id}</strong></div>
                                                <div>التاريخ: {ord.date}</div>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 text-xs">
                                            <div>
                                                <div className="text-gray-600">المرسل إليه (الزبون):</div>
                                                <div className="font-bold text-sm">{ord.clientName}</div>
                                                <div>الهاتف: {ord.phone}</div>
                                            </div>
                                            <div>
                                                <div className="text-gray-600">الوجهة:</div>
                                                <div className="font-bold">{ord.wilaya}</div>
                                                <div>{ord.address}</div>
                                            </div>
                                        </div>
                                        <div className="border-t border-b border-black py-2 text-xs">
                                            <div>المنتج: <strong>{ord.product} ({ord.quantity} قطعة)</strong></div>
                                        </div>
                                        <div className="flex justify-between items-center pt-1">
                                            <div className="text-lg font-extrabold border-2 border-black p-1 rounded">
                                                COD: {ord.totalAmount} DZD
                                            </div>
                                            <div className="text-center font-mono font-bold text-xs">
                                                [{ord.trackingCode || 'NO-TRACKING'}]
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <footer className="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500 no-print">
                        E-Com Pulse DZ Pro &copy; 2026 - لوحة تحكم التجارة الإلكترونية، الموظفين والربط البرمجي
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
